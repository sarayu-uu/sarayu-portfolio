<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Illustration of Sarayu at her desk at sunset, with a phone playing music and a plate of pani puri">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e4f2"/>
      <stop offset="1" stop-color="#fbf1e2"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c5ccf"/>
      <stop offset="0.45" stop-color="#e9798a"/>
      <stop offset="0.8" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ffd58a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="puri" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f6d08a"/>
      <stop offset="0.6" stop-color="#dc9d43"/>
      <stop offset="1" stop-color="#b8782a"/>
    </radialGradient>
    <clipPath id="face"><ellipse cx="300" cy="300" rx="74" ry="92"/></clipPath>
    <clipPath id="torso"><path d="M150 700 C150 525 200 458 270 442 L330 442 C400 458 450 525 450 700 Z"/></clipPath>
    <clipPath id="win"><rect x="36" y="44" width="292" height="250" rx="10"/></clipPath>
    <style>
      .note { animation: float 3.6s ease-out infinite; opacity: 0; }
      .n2 { animation-delay: 1.2s; }
      .n3 { animation-delay: 2.4s; }
      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
        15% { opacity: 1; }
        50% { transform: translate(-10px, -55px) rotate(-8deg); }
        100% { transform: translate(8px, -120px) rotate(6deg); opacity: 0; }
      }
            @media (prefers-reduced-motion: reduce) { .note { animation: none; } .note { opacity: 0.8; } }
    </style>
  </defs>

  <rect width="600" height="700" fill="url(#wall)"/>

  <!-- window at sunset -->
  <rect x="36" y="44" width="292" height="250" rx="10" fill="url(#sunset)"/>
  <g clip-path="url(#win)">
    <circle cx="210" cy="246" r="40" fill="#ffe29a"/>
    <circle cx="210" cy="246" r="58" fill="#ffe29a" opacity="0.25"/>
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="96" cy="100" rx="38" ry="9"/><ellipse cx="270" cy="128" rx="30" ry="7"/>
    </g>
    <g fill="#4a3a6b">
      <rect x="40" y="200" width="44" height="100"/><rect x="92" y="160" width="38" height="140"/>
      <rect x="138" y="222" width="52" height="78"/><rect x="236" y="176" width="34" height="124"/>
      <rect x="276" y="214" width="56" height="86"/><rect x="104" y="146" width="4" height="16"/>
    </g>
    <g fill="#ffd27a">
      <rect x="100" y="172" width="7" height="7"/><rect x="114" y="186" width="7" height="7"/><rect x="100" y="214" width="7" height="7"/>
      <rect x="244" y="190" width="6" height="7"/><rect x="256" y="206" width="6" height="7"/><rect x="244" y="236" width="6" height="7"/>
      <rect x="50" y="214" width="7" height="7"/><rect x="66" y="240" width="7" height="7"/><rect x="290" y="228" width="7" height="7"/>
      <rect x="150" y="236" width="7" height="7"/><rect x="166" y="252" width="7" height="7"/>
    </g>
  </g>
  <g fill="none" stroke="#f7efe2" stroke-width="10">
    <rect x="36" y="44" width="292" height="250" rx="10"/>
    <path d="M182 44 v250 M36 170 h292"/>
  </g>

  <!-- wall clock -->
  <circle cx="500" cy="84" r="34" fill="#ffffff" stroke="#2b1913" stroke-width="4"/>
  <path d="M500 84 v-20 M500 84 l14 8" stroke="#2b1913" stroke-width="4" stroke-linecap="round"/>

  <!-- shelf -->
  <rect x="400" y="190" width="170" height="10" rx="3" fill="#b9875a"/>
  <rect x="410" y="140" width="14" height="50" fill="#c2410c"/><rect x="426" y="148" width="12" height="42" fill="#2b1913"/>
  <rect x="440" y="136" width="16" height="54" fill="#7fb8a8"/>
  <path d="M516 190 l6 -32 h30 l6 32 z" fill="#d9a07a"/>
  <g fill="#4f8a5b">
    <path d="M537 158 C520 130 506 128 498 132 C510 140 520 148 537 158 Z"/>
    <path d="M537 158 C540 124 552 112 562 110 C558 126 550 142 537 158 Z"/>
    <path d="M537 158 C530 120 534 104 540 96 C546 112 544 136 537 158 Z"/>
  </g>

  <!-- sticky notes -->
  <g transform="translate(428 262) rotate(-4)" font-family="Comic Sans MS, Marker Felt, cursive" font-size="14" fill="#2b1913">
    <rect width="82" height="74" fill="#fde68a"/>
    <text x="8" y="26">it works</text><text x="8" y="44">on my</text><text x="8" y="62">laptop :)</text>
  </g>
  <g transform="translate(500 300) rotate(5)" font-family="Comic Sans MS, Marker Felt, cursive" font-size="14" fill="#2b1913">
    <rect width="80" height="74" fill="#fbcfe8"/>
    <text x="8" y="28">deploy</text><text x="8" y="46">friday?</text><text x="8" y="64" font-weight="700">NO.</text>
  </g>

  <!-- hair back -->
  <path d="M220 250 C196 340 186 470 168 640 L432 640 C414 470 404 340 380 250 Z" fill="#2b1913"/>

  <!-- neck -->
  <rect x="272" y="372" width="56" height="74" fill="#b97a50"/>
  <path d="M272 372 h56 v40 Q300 420 272 404 Z" fill="#9c6340"/>

  <!-- top -->
  <path d="M150 700 C150 525 200 458 270 442 L330 442 C400 458 450 525 450 700 Z" fill="#f6f2ea" stroke="#2b1913" stroke-width="3"/>
  <g clip-path="url(#torso)" stroke="#2b1913" stroke-opacity="0.12" stroke-width="2">
    <path d="M170 450 v260 M186 450 v260 M202 450 v260 M218 450 v260 M234 450 v260 M250 450 v260 M266 450 v260 M282 450 v260 M298 450 v260 M314 450 v260 M330 450 v260 M346 450 v260 M362 450 v260 M378 450 v260 M394 450 v260 M410 450 v260 M426 450 v260"/>
  </g>
  <path clip-path="url(#torso)" d="M360 450 C420 480 450 540 450 700 L380 700 C390 600 380 500 340 450 Z" fill="#2b1913" opacity="0.08"/>
  <path d="M266 426 Q300 444 334 426 L336 448 Q300 466 264 448 Z" fill="#f6f2ea" stroke="#2b1913" stroke-width="3"/>

  <!-- hair over shoulders -->
  <path d="M226 276 C206 380 200 500 196 640 L250 640 C244 520 240 410 242 330 Z" fill="#2b1913"/>
  <path d="M374 276 C394 380 400 500 404 640 L350 640 C356 520 360 410 358 330 Z" fill="#2b1913"/>

  <!-- face -->
  <ellipse cx="300" cy="300" rx="74" ry="92" fill="#b97a50"/>
  <g clip-path="url(#face)">
    <ellipse cx="258" cy="330" rx="16" ry="9" fill="#e08a7c" opacity="0.2"/>
    <ellipse cx="342" cy="330" rx="16" ry="9" fill="#e08a7c" opacity="0.2"/>
  </g>
  <ellipse cx="300" cy="300" rx="74" ry="92" fill="none" stroke="#2b1913" stroke-width="3"/>

  <!-- hoops -->
  <circle cx="232" cy="334" r="6" fill="none" stroke="#d4a017" stroke-width="3"/>
  <circle cx="368" cy="334" r="6" fill="none" stroke="#d4a017" stroke-width="3"/>

  <!-- hair front -->
  <path d="M220 312 C206 218 254 186 300 188 C346 186 394 218 380 312 C374 262 344 232 300 230 C256 232 226 262 220 312 Z" fill="#2b1913"/>
  <path d="M300 190 Q296 210 300 230" stroke="#5a3a2c" stroke-width="3" fill="none"/>
  <path d="M226 252 C212 300 214 352 226 402 L238 400 C230 350 232 300 246 256 C240 250 232 249 226 252 Z" fill="#2b1913"/>

  <!-- brows -->
  <path d="M255 263 L284 259.5" stroke="#2b1913" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M316 259.5 L345 263" stroke="#2b1913" stroke-width="4.5" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M248 292 Q268 276 291 290 Q268 302 248 292 Z" fill="#fbf7f0"/>
  <path d="M309 290 Q332 276 352 292 Q332 302 309 290 Z" fill="#fbf7f0"/>

  <!-- straight nose + small stud -->
  <path d="M304 300 L304 327" stroke="#8a5434" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M292 333 Q298 338 300 336 Q302 338 308 333" stroke="#8a5434" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="310" cy="330" r="1.9" fill="#f2c94c"/>

  <!-- mole -->
  <circle cx="338" cy="344" r="2.2" fill="#3a2016"/>

  <!-- smile -->
  <path d="M277 351 Q290 344 300 348 Q310 344 323 351 Q300 359 277 351 Z" fill="#8a4a4a"/>
  <path d="M280 353 Q300 373 320 353 Q300 361 280 353 Z" fill="#9d5c5c"/>
  <path d="M272 346 Q275 352 280 353 M328 346 Q325 352 320 353" stroke="#5a2f2f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- desk -->
  <rect x="0" y="596" width="600" height="104" fill="#c89b6d"/>
  <rect x="0" y="596" width="600" height="40" fill="#dcb488"/>
  <rect x="0" y="634" width="600" height="3" fill="#b58757"/>

  <!-- laptop lid with sitcom stickers -->
  <rect x="24" y="492" width="214" height="116" rx="10" fill="#d1d5db" stroke="#2b1913" stroke-width="3"/>
  <circle cx="131" cy="552" r="11" fill="#9ca3af"/>
  <g transform="translate(36 504) rotate(-6)">
    <rect width="96" height="30" rx="6" fill="#ffffff" stroke="#2b1913" stroke-width="2"/>
    <text x="48" y="13" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="#2b1913">DUNDER</text>
    <text x="48" y="25" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="10" fill="#2b1913">MIFFLIN</text>
  </g>
  <g transform="translate(150 500) rotate(8)">
    <rect width="84" height="34" rx="17" fill="#facc15" stroke="#2b1913" stroke-width="2"/>
    <g transform="translate(15 17) scale(0.85)" fill="none" stroke="#1d4ed8" stroke-width="1.6">
      <ellipse rx="10" ry="4"/><ellipse rx="10" ry="4" transform="rotate(60)"/><ellipse rx="10" ry="4" transform="rotate(-60)"/>
      <circle r="1.8" fill="#1d4ed8"/>
    </g>
    <text x="56" y="21" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="11" fill="#b91c1c">BAZINGA!</text>
  </g>
  <g transform="translate(34 566) rotate(-3)">
    <rect width="120" height="30" rx="6" fill="#1e293b"/>
    <text x="60" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#f8fafc">that's what she said</text>
  </g>
  <g transform="translate(196 572) rotate(-10)">
    <circle r="15" fill="#c2410c"/>
    <text y="5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">AI</text>
  </g>

  <!-- phone lying flat on the desk, playing music -->
  <ellipse cx="372" cy="626" rx="46" ry="5" fill="#2b1913" opacity="0.15"/>
  <polygon points="330,628 410,628 420,604 340,604" fill="#111827"/>
  <polygon points="336,625 404,625 412,607 344,607" fill="url(#screen)"/>
  <circle cx="374" cy="616" r="5" fill="#ffffff" opacity="0.9"/>
  <path d="M372 613 v6 l5 -3 z" fill="#db2777"/>
  <g font-family="Segoe UI Symbol, Apple Symbols, DejaVu Sans, sans-serif" fill="#8b5cf6" font-size="28" stroke="#ffffff" stroke-width="3" paint-order="stroke">
    <text class="note" x="352" y="600">♪</text>
    <text class="note n2" x="378" y="600" fill="#db2777">♫</text>
    <text class="note n3" x="364" y="600">♪</text>
  </g>

  <!-- pani puri: steel katori of pani + plate of filled puris -->
  <path d="M440 596 Q472 632 504 596 Z" fill="#cfd5dc" stroke="#2b1913" stroke-width="2"/>
  <ellipse cx="472" cy="596" rx="32" ry="7" fill="#e5e9ee" stroke="#2b1913" stroke-width="2"/>
  <ellipse cx="472" cy="597" rx="26" ry="4.5" fill="#6fae3a"/>
  <g fill="#2f7d32"><circle cx="464" cy="596" r="2"/><circle cx="478" cy="598" r="1.6"/><circle cx="484" cy="595" r="1.4"/></g>

  <ellipse cx="552" cy="618" rx="46" ry="10" fill="#ffffff" stroke="#2b1913" stroke-width="2"/>
  <g stroke="#7a4a1f" stroke-width="1.5">
    <ellipse cx="524" cy="604" rx="15" ry="13" fill="url(#puri)"/>
    <ellipse cx="552" cy="606" rx="15" ry="13" fill="url(#puri)"/>
    <ellipse cx="580" cy="604" rx="15" ry="13" fill="url(#puri)"/>
    <ellipse cx="538" cy="582" rx="15" ry="13" fill="url(#puri)"/>
    <ellipse cx="566" cy="582" rx="15" ry="13" fill="url(#puri)"/>
  </g>
  <g fill="#fff3d6" opacity="0.6">
    <circle cx="518" cy="600" r="1.6"/><circle cx="548" cy="603" r="1.4"/><circle cx="586" cy="600" r="1.6"/>
    <circle cx="531" cy="585" r="1.4"/><circle cx="572" cy="586" r="1.6"/>
  </g>
  <!-- cracked tops with masala filling and pani -->
  <g>
    <path d="M530 575 q4 -5 8 -3 q4 -3 8 1 q-1 6 -8 6 q-7 0 -8 -4 z" fill="#5b3412"/>
    <circle cx="534" cy="575" r="2.2" fill="#f2cf6b"/><circle cx="539" cy="574" r="2" fill="#a0612a"/><circle cx="543" cy="576" r="1.8" fill="#f2cf6b"/>
    <ellipse cx="538" cy="577" rx="5" ry="1.8" fill="#7cbf3f"/>
    <path d="M558 575 q4 -5 8 -3 q4 -3 8 1 q-1 6 -8 6 q-7 0 -8 -4 z" fill="#5b3412"/>
    <circle cx="562" cy="575" r="2" fill="#a0612a"/><circle cx="567" cy="574" r="2.2" fill="#f2cf6b"/><circle cx="571" cy="576" r="1.6" fill="#3f9142"/>
    <ellipse cx="566" cy="577" rx="5" ry="1.8" fill="#7cbf3f"/>
    <path d="M574 578 q3 6 0 11" stroke="#7cbf3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
