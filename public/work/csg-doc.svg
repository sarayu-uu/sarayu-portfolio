<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Case Study Generator: an AI-drafted document exported to Google Docs, about 80% less manual time">
  <rect width="1600" height="900" fill="#fbe3a0"/>
  <circle cx="1450" cy="120" r="260" fill="#f8d36b"/>

  <!-- back sheet -->
  <g transform="rotate(-6 640 470)">
    <rect x="390" y="110" width="520" height="700" rx="18" fill="#f3efe6" stroke="#3b2414" stroke-opacity="0.15" stroke-width="3"/>
  </g>
  <!-- front sheet -->
  <g transform="rotate(3 700 470)">
    <rect x="450" y="90" width="540" height="730" rx="18" fill="#ffffff" stroke="#3b2414" stroke-opacity="0.18" stroke-width="3"/>
    <rect x="510" y="160" width="300" height="34" rx="8" fill="#3b2414"/>
    <rect x="510" y="214" width="190" height="18" rx="9" fill="#c2410c"/>
    <g fill="#3b2414" fill-opacity="0.18">
      <rect x="510" y="276" width="420" height="16" rx="8"/><rect x="510" y="308" width="390" height="16" rx="8"/>
      <rect x="510" y="340" width="410" height="16" rx="8"/><rect x="510" y="372" width="260" height="16" rx="8"/>
    </g>
    <!-- canvas grid -->
    <g fill="none" stroke="#3b2414" stroke-opacity="0.35" stroke-width="3">
      <rect x="510" y="430" width="420" height="230" rx="10"/>
      <path d="M650 430 v230 M790 430 v230 M510 545 h420"/>
    </g>
    <g fill="#c2410c" fill-opacity="0.85">
      <rect x="528" y="450" width="100" height="14" rx="7"/><rect x="668" y="450" width="80" height="14" rx="7"/>
      <rect x="808" y="450" width="104" height="14" rx="7"/><rect x="528" y="565" width="90" height="14" rx="7"/>
    </g>
    <g fill="#3b2414" fill-opacity="0.18">
      <rect x="510" y="700" width="400" height="16" rx="8"/><rect x="510" y="732" width="320" height="16" rx="8"/>
    </g>
  </g>

  <!-- AI sparkle chip -->
  <g transform="translate(160 250)">
    <rect width="250" height="96" rx="48" fill="#3b2414"/>
    <path d="M58 22 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 l26 -10 z" fill="#fdba74"/>
    <text x="110" y="62" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="36" fill="#fbe3a0">Gemini</text>
  </g>
  <path d="M410 300 C 450 300, 450 330, 470 330" stroke="#3b2414" stroke-width="5" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- export chip -->
  <g transform="translate(1110 560)">
    <rect width="300" height="96" rx="48" fill="#ffffff" stroke="#3b2414" stroke-opacity="0.2" stroke-width="3"/>
    <rect x="34" y="24" width="38" height="48" rx="6" fill="#2563eb"/>
    <g fill="#ffffff"><rect x="42" y="38" width="22" height="5" rx="2"/><rect x="42" y="48" width="22" height="5" rx="2"/><rect x="42" y="58" width="14" height="5" rx="2"/></g>
    <text x="92" y="62" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#3b2414">Google Docs</text>
  </g>
  <path d="M1000 600 C 1050 600, 1060 608, 1100 608" stroke="#3b2414" stroke-width="5" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- sticker -->
  <g transform="translate(1270 300) rotate(-10)">
    <circle r="150" fill="#c2410c"/>
    <circle r="132" fill="none" stroke="#fbe3a0" stroke-width="3" stroke-dasharray="6 10"/>
    <text y="12" text-anchor="middle" font-family="Georgia, serif" font-size="96" fill="#fff7ed">80%</text>
    <text y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#fbe3a0">LESS MANUAL</text>
  </g>
</svg>
