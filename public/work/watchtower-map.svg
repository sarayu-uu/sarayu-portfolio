<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">WatchTower mind map</title>
  <desc id="d">WatchTower is an LLM control plane. Its six parts are access, routing, compliance, RBAC, audit and chat.</desc>
  <style>
    .card { fill: #ffffff; stroke: rgba(20,20,20,0.14); stroke-width: 2; }
    .h { font: 600 30px Georgia, 'Times New Roman', serif; fill: #141414; }
    .k { font: 600 15px Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #c2410c; }
    .b { font: 19px Helvetica, Arial, sans-serif; fill: #5f5b55; }
    .wire { fill: none; stroke: #141414; stroke-opacity: 0.35; stroke-width: 2.5; }
    .dot { fill: #c2410c; }
  </style>
  <rect width="1600" height="1000" fill="#f7f5f0"/>
  <g fill="rgba(20,20,20,0.07)">
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6"/></pattern>
    <rect width="1600" height="1000" fill="url(#grid)"/>
  </g>

  <!-- wires: center (800,500) to card inner edges -->
  <path class="wire" d="M640 470 C 520 470, 520 200, 440 200"/>
  <path class="wire" d="M620 500 L 440 500"/>
  <path class="wire" d="M640 530 C 520 530, 520 800, 440 800"/>
  <path class="wire" d="M960 470 C 1080 470, 1080 200, 1160 200"/>
  <path class="wire" d="M980 500 L 1160 500"/>
  <path class="wire" d="M960 530 C 1080 530, 1080 800, 1160 800"/>
  <g class="dot">
    <circle cx="440" cy="200" r="6"/><circle cx="440" cy="500" r="6"/><circle cx="440" cy="800" r="6"/>
    <circle cx="1160" cy="200" r="6"/><circle cx="1160" cy="500" r="6"/><circle cx="1160" cy="800" r="6"/>
  </g>

  <!-- center -->
  <rect x="620" y="420" width="360" height="160" rx="80" fill="#141414"/>
  <text x="800" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#f7f5f0">WatchTower</text>
  <text x="800" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#fdba74">LLM CONTROL PLANE</text>

  <!-- left column -->
  <g transform="translate(80 110)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">01 · ACCESS</text>
    <text class="h" x="28" y="84">Who gets in</text>
    <text class="b" x="28" y="120">Caddy forward-auth on every request</text>
    <text class="b" x="28" y="148">Session cookie + JWT, trusted-header SSO</text>
  </g>
  <g transform="translate(80 410)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">02 · COMPLIANCE</text>
    <text class="h" x="28" y="84">What leaves the org</text>
    <text class="b" x="28" y="120">PII masked before any prompt</text>
    <text class="b" x="28" y="148">reaches a provider</text>
  </g>
  <g transform="translate(80 710)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">03 · AUDIT</text>
    <text class="h" x="28" y="84">Every call, on record</text>
    <text class="b" x="28" y="120">Cost, tokens and a masked preview</text>
    <text class="b" x="28" y="148">Never the full conversation</text>
  </g>

  <!-- right column -->
  <g transform="translate(1160 110)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">04 · ROUTING</text>
    <text class="h" x="28" y="84">Any provider, one API</text>
    <text class="b" x="28" y="120">OpenAI-compatible shim + adapters</text>
    <text class="b" x="28" y="148">Groq, Bedrock, Mistral, DeepSeek…</text>
  </g>
  <g transform="translate(1160 410)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">05 · RBAC</text>
    <text class="h" x="28" y="84">Which models, for whom</text>
    <text class="b" x="28" y="120">Model list = org config ∩ role</text>
    <text class="b" x="28" y="148">Re-checked on every completion</text>
  </g>
  <g transform="translate(1160 710)">
    <rect class="card" width="360" height="180" rx="22"/>
    <text class="k" x="28" y="44">06 · CHAT</text>
    <text class="h" x="28" y="84">Don't rebuild chat</text>
    <text class="b" x="28" y="120">Open WebUI, unmodified, embedded</text>
    <text class="b" x="28" y="148">Threads, uploads, RAG, voice, tools</text>
  </g>

  <text x="800" y="960" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5f5b55">Docker Compose · FastAPI · Postgres · Caddy · Open WebUI</text>
</svg>
